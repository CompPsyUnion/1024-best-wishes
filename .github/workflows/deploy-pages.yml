name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Real inputs only — docs-only changes never redeploy the site.
    paths:
      - "src/**"
      - "public/**"
      - index.html
      - vite.config.ts
      - tsconfig.json
      - package.json
      - pnpm-lock.yaml
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# One deployment at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json `packageManager` —
      # don't pass a `version` here, it conflicts and throws ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm build` runs tsc first, then vite build -> dist/
      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
